<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="demo1"></h2>
    <p id="demo"></p>
    <script>
        let stat=document.getElementById('demo')
        function c1(a,b,callback){
            let sum= a+b;
            return callback(sum);
        }
        function c2(sum){
            return sum;
        }
        stat.innerHTML=c1(3,6,c2);

        //second example
        const arr1=[1,-2,3,-4,5,0];
       stat.innerHTML+= "<br/>"+filter(arr1,(x) =>{ return x>0});

        function filter(arr,callback) {
            const arr2=[];
            for(const x of arr){
                if(callback(x)){
                    arr2.push(x);
                }
            }
           4
            return arr2;
        }
        // Using setInterval()
      
        setInterval(countDown,1000);
        let number=prompt("Enter any number for countDown");
        function countDown(){
            number--;
            if(number<0){
                document.getElementById("demo1").innerHTML= "Welcome";
            }
            else{
                document.getElementById("demo1").innerHTML= number;
            }
        }

        
    </script>

</body>
</html>
